<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicStats — Compartir</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Google AdSense: reemplaza ca-pub-XXXXXXXXXXXXXXXX con tu Publisher ID real -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #FC3C44; --dark: #0a0a0a; --card: #141414; --card2: #1c1c1c;
      --border: rgba(255,255,255,0.07); --text1: #fff; --text2: rgba(255,255,255,0.5);
      --text3: rgba(255,255,255,0.22); --surface: #1e1e1e;
    }
    html,body{min-height:100%;}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--dark);color:var(--text1);-webkit-font-smoothing:antialiased;}
    .app{max-width:1020px;margin:0 auto;padding:24px 20px 60px;}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .logo-mark{width:36px;height:36px;background:var(--pink);border-radius:9px;display:flex;align-items:center;justify-content:center;}
    .logo-mark svg{width:20px;height:20px;fill:#fff;}
    .logo-name{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;color:var(--text1);}
    .back{color:var(--text2);font-size:13px;text-decoration:none;transition:color .15s;}
    .back:hover{color:var(--text1);}
    /* Ad slots */
    .ad{background:var(--card);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
    .ad-top{min-height:90px;margin-bottom:24px;}
    .ad-mid{min-height:260px;width:100%;}
    .ad-bot{min-height:90px;margin-top:24px;}
    .ad-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
    /* Page */
    .page-title{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;letter-spacing:-0.8px;margin-bottom:4px;}
    .page-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
    .type-row{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
    .type-btn{padding:7px 16px;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--border);background:var(--card);color:var(--text2);transition:all .15s;font-family:'Inter',sans-serif;}
    .type-btn.active{background:#fff;border-color:#fff;color:#000;}
    .type-btn:hover:not(.active){color:var(--text1);border-color:rgba(255,255,255,.2);}
    /* Grid */
    .grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;}
    /* Preview */
    .preview{background:var(--card);border:0.5px solid var(--border);border-radius:16px;padding:14px;position:sticky;top:16px;}
    .preview-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600;}
    .canvas-wrap{width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;}
    canvas{width:100%;height:100%;display:block;}
    /* Controls */
    .controls{display:flex;flex-direction:column;gap:12px;}
    .ctrl{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:14px;}
    .ctrl-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
    /* Palettes */
    .palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
    .pal{aspect-ratio:9/16;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative;overflow:hidden;}
    .pal.active{border-color:#fff;}
    .pal span{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.85);padding:4px 2px;background:linear-gradient(transparent,rgba(0,0,0,.6));}
    .p-noir{background:linear-gradient(160deg,#080808,#111,#0d0d0d);}
    .p-rose{background:linear-gradient(160deg,#0e0008,#1a0510,#120008);}
    .p-slate{background:linear-gradient(160deg,#060a10,#0b1220,#080e18);}
    .p-sage{background:linear-gradient(160deg,#040a06,#081408,#060e06);}
    /* Input */
    .ctrl-input{width:100%;background:var(--surface);border:0.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text1);font-size:13px;outline:none;transition:border-color .15s;font-family:'Inter',sans-serif;}
    .ctrl-input:focus{border-color:rgba(255,255,255,.25);}
    .ctrl-input::placeholder{color:var(--text3);}
    /* Period */
    .period-row{display:flex;gap:5px;}
    .period-btn{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid var(--border);background:var(--surface);color:var(--text2);transition:all .15s;font-family:'Inter',sans-serif;text-align:center;}
    .period-btn.active{background:var(--card2);border-color:rgba(255,255,255,.2);color:var(--text1);}
    /* Buttons */
    .btn-dl{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Unbounded',sans-serif;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:-.3px;}
    .btn-dl:hover{background:#ddd;transform:translateY(-1px);}
    .btn-dl svg{width:15px;height:15px;fill:#000;}
    .share-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
    .btn-ig{padding:10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;transition:opacity .15s;}
    .btn-ig:hover{opacity:.8;}
    .btn-cp{padding:10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;}
    .btn-cp:hover{color:var(--text1);}
    .ig-note{font-size:11px;color:var(--text3);line-height:1.7;padding:8px 10px;background:rgba(255,255,255,.03);border-radius:8px;border:0.5px solid var(--border);}
    /* Toast */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#fff;color:#000;padding:11px 22px;border-radius:50px;font-size:13px;font-weight:700;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:999;font-family:'Inter',sans-serif;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    @media(max-width:680px){.grid{grid-template-columns:1fr;}.preview{position:static;}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <a href="/" class="logo">

    <div class="controls">

        <div class="ctrl-title">Paleta</div>

      <!-- Ad mid (300×250) -->
      <div class="ad ad-mid">
        <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX" data-ad-format="rectangle"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script> -->

        <button class="btn-cp" onclick="copyImg()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>

<script>
'use strict';
const PALS={
  noir:{bg:['#080808','#111','#0d0d0d'],acc:'#FC3C44',accRGB:'252,60,68',txt:'#fff',sub:'rgba(255,255,255,.45)',muted:'rgba(255,255,255,.18)'},
  rose:{bg:['#0e0008','#1a0510','#120008'],acc:'#FF6B9D',accRGB:'255,107,157',txt:'#fff',sub:'rgba(255,255,255,.45)',muted:'rgba(255,255,255,.18)'},
  slate:{bg:['#060a10','#0b1220','#080e18'],acc:'#64D2FF',accRGB:'100,210,255',txt:'#fff',sub:'rgba(255,255,255,.45)',muted:'rgba(255,255,255,.18)'},
  sage:{bg:['#040a06','#081408','#060e06'],acc:'#30D158',accRGB:'48,209,88',txt:'#fff',sub:'rgba(255,255,255,.45)',muted:'rgba(255,255,255,.18)'},
};
const PERIODS={alltime:'All time',month:'This month',week:'This week'};
const W=1080,H=1920,PAD=88;
let cardType='artistas',palKey='noir',period='alltime',state=null;
const C=document.getElementById('C'),ctx=C.getContext('2d');

function loadState(){try{const s=localStorage.getItem('ms_state');return s?JSON.parse(s):null;}catch{return null;}}
function demo(){return{userName:'',totalMins:18432,totalPlays:3369,streak:47,artists:[{name:'Bad Bunny',plays:847,mins:2541},{name:'Taylor Swift',plays:623,mins:1869},{name:'Drake',plays:511,mins:1533},{name:'The Weeknd',plays:489,mins:1467},{name:'Peso Pluma',plays:334,mins:1002}],songs:[{title:'Tití Me Preguntó',artist:'Bad Bunny',plays:142},{title:'Cruel Summer',artist:'Taylor Swift',plays:118},{title:'One Dance',artist:'Drake',plays:97},{title:'Blinding Lights',artist:'The Weeknd',plays:89},{title:'LADY GAGA',artist:'Peso Pluma',plays:78}]};}

function rrect(x,y,w,h,r,fill,strokeColor){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(strokeColor){ctx.strokeStyle=strokeColor;ctx.lineWidth=1;ctx.stroke();}
}
function f(sz,wt){ctx.font=`${wt} ${sz}px 'Helvetica Neue',Helvetica,Arial,sans-serif`;}
function t(s,x,y,mw){if(mw)ctx.fillText(String(s),x,y,mw);else ctx.fillText(String(s),x,y);}
function rt(s,x,y){ctx.save();ctx.textAlign='right';t(s,x,y);ctx.restore();}
function ct(s,x,y){ctx.save();ctx.textAlign='center';t(s,x,y);ctx.restore();}

function bg(p){
  const g=ctx.createLinearGradient(0,0,W*.5,H);
  g.addColorStop(0,p.bg[0]);g.addColorStop(.55,p.bg[1]);g.addColorStop(1,p.bg[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // noise
  ctx.save();ctx.globalAlpha=.022;
  for(let i=0;i<2500;i++){ctx.fillStyle='#fff';ctx.fillRect(Math.random()*W,Math.random()*H,1,1);}
  ctx.restore();
  // glows
  glow(W*.82,H*.08,480,p.acc,.13);
  glow(W*.12,H*.78,340,p.acc,.07);
  glow(W*.45,H*.48,560,p.acc,.03);
}
function glow(x,y,r,col,a){
  ctx.save();const rg=ctx.createRadialGradient(x,y,0,x,y,r);
  const hex=Math.round(a*255).toString(16).padStart(2,'0');
  rg.addColorStop(0,col+hex);rg.addColorStop(1,col+'00');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}
function header(p,handle,per){
  // logo pill
  rrect(PAD,76,196,52,26,`rgba(${p.accRGB},.1)`,`rgba(${p.accRGB},.25)`);
  ctx.fillStyle=p.acc;f(22,'700');t('MusicStats',PAD+18,113);
  // handle
  ctx.fillStyle=p.txt;f(60,'300');t(handle?'@'+handle:'@musicstats',PAD,214);
  // period tag
  rrect(PAD,234,230,46,23,`rgba(${p.accRGB},.12)`);
  ctx.fillStyle=p.acc;f(27,'600');t(per,PAD+18,268);
  // line
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(PAD,306);ctx.lineTo(W-PAD,306);ctx.stroke();ctx.restore();
}
function footer(p){
  ctx.fillStyle='rgba(255,255,255,.2)';f(28,'400');ct('musicstats-gzwm.vercel.app',W/2,H-68);
}

async function drawArtistas(p,s){
  const arts=[...s.artists].sort((a,b)=>b.plays-a.plays).slice(0,5);
  const mx=arts[0]?.plays||1;
  ctx.fillStyle=p.acc;f(28,'700');t('TOP ARTISTAS',PAD,376);
  ctx.fillStyle=p.txt;f(114,'900');t('Mis',PAD,500);
  ctx.fillStyle=p.acc;f(114,'900');t('favoritos',PAD,624);
  rrect(PAD,662,64,5,2.5,p.acc);
  arts.forEach((a,i)=>{
    const y=748+i*212,bw=Math.max(50,Math.round((a.plays/mx)*(W-PAD*2-70)));
    rrect(PAD-20,y-62,W-PAD*2+40,172,18,'rgba(255,255,255,.025)');
    ctx.save();ctx.globalAlpha=.055;ctx.fillStyle=p.txt;f(210,'900');t(i+1,PAD-14,y+82);ctx.restore();
    // Artwork circle
    if(artUrls[i]){await drawArtworkInCanvas(ctx,artUrls[i],PAD+62,y-42,120,120,14);}
    const artOffsetX = artUrls[i] ? PAD+200 : PAD+62;
    ctx.fillStyle=p.txt;f(i===0?62:52,i===0?'700':'500');
    const nm=a.name.length>16?a.name.slice(0,16)+'…':a.name;t(nm,artOffsetX,y+12);
    ctx.fillStyle=p.acc;f(46,'800');rt(a.plays.toLocaleString(),W-PAD,y+12);
    ctx.fillStyle=p.sub;f(27,'400');rt('plays',W-PAD,y+54);
    rrect(PAD+62,y+32,W-PAD*2-62,6,3,'rgba(255,255,255,.08)');
    const bg2=ctx.createLinearGradient(PAD+62,0,PAD+62+bw,0);bg2.addColorStop(0,p.acc);bg2.addColorStop(1,p.acc+'44');
    rrect(PAD+62,y+32,bw,6,3,bg2);
  });
}
async function drawCanciones(p,s){
  const songs=[...s.songs].sort((a,b)=>b.plays-a.plays).slice(0,5);
  const mx=songs[0]?.plays||1;
  ctx.fillStyle=p.acc;f(28,'700');t('TOP CANCIONES',PAD,376);
  ctx.fillStyle=p.txt;f(114,'900');t('En',PAD,500);
  ctx.fillStyle=p.acc;f(114,'900');t('repeat',PAD,624);
  rrect(PAD,662,64,5,2.5,p.acc);
  songs.forEach((sg,i)=>{
    const y=748+i*212,title=sg.title||sg.name||'',short=title.length>17?title.slice(0,17)+'…':title;
    const bw=Math.max(50,Math.round((sg.plays/mx)*(W-PAD*2-62)));
    rrect(PAD-20,y-62,W-PAD*2+40,172,18,'rgba(255,255,255,.025)');
    ctx.save();ctx.globalAlpha=.055;ctx.fillStyle=p.txt;f(210,'900');t(i+1,PAD-14,y+82);ctx.restore();
    if(songUrls[i]){await drawArtworkInCanvas(ctx,songUrls[i],PAD+62,y-42,120,120,14);}
    const songOffX=songUrls[i]?PAD+200:PAD+62;
    ctx.fillStyle=p.txt;f(i===0?58:48,i===0?'700':'500');t(short,songOffX,y+10);
    ctx.fillStyle=p.sub;f(32,'400');t(sg.artist||'',PAD+62,y+54);
    ctx.fillStyle=p.acc;f(44,'800');rt(sg.plays+'×',W-PAD,y+10);
    rrect(PAD+62,y+72,W-PAD*2-62,5,2.5,'rgba(255,255,255,.08)');
    const bg2=ctx.createLinearGradient(PAD+62,0,PAD+62+bw,0);bg2.addColorStop(0,p.acc);bg2.addColorStop(1,p.acc+'44');
    rrect(PAD+62,y+72,bw,5,2.5,bg2);
  });
}
function drawMinutos(p,s){
  const mins=s.totalMins||0,hrs=Math.floor(mins/60);
  ctx.fillStyle=p.acc;f(28,'700');t('TIEMPO ESCUCHADO',PAD,376);
  ctx.fillStyle=p.txt;f(114,'900');t('Mis',PAD,500);ctx.fillStyle=p.acc;f(114,'900');t('números',PAD,624);
  rrect(PAD,662,64,5,2.5,p.acc);
  ctx.fillStyle=p.acc;f(188,'900');ct(mins.toLocaleString(),W/2,910);
  ctx.fillStyle=p.sub;f(46,'300');ct('minutos',W/2,980);
  ctx.fillStyle=`rgba(${p.accRGB},.3)`;f(50,'400');ct('· · ·',W/2,1060);
  ctx.fillStyle=p.txt;f(150,'900');ct(hrs.toLocaleString(),W/2,1220);
  ctx.fillStyle=p.sub;f(44,'300');ct('horas en total',W/2,1286);
  const stats=[{l:'Reproducciones',v:(s.totalPlays||0).toLocaleString()},{l:'Días de racha 🔥',v:(s.streak||0)+''},{l:'Canciones únicas',v:(s.songs?.length||0)+''},{l:'Promedio / día',v:Math.round(mins/30)+' min'}];
  const cW=(W-PAD*2-24)/2;
  stats.forEach((st,i)=>{
    const col=i%2,row=Math.floor(i/2),cx=PAD+col*(cW+24),cy=1350+row*230;
    rrect(cx,cy,cW,200,20,'rgba(255,255,255,.04)',`rgba(${p.accRGB},.12)`);
    ctx.fillStyle=p.acc;f(70,'900');t(st.v,cx+22,cy+90);
    ctx.fillStyle=p.sub;f(28,'400');t(st.l,cx+22,cy+140);
  });
}
async function drawResumen(p,s){
  const mins=s.totalMins||0,hrs=Math.floor(mins/60);
  const topA=[...s.artists].sort((a,b)=>b.plays-a.plays)[0]||{name:'—',plays:0};
  const topS=[...s.songs].sort((a,b)=>b.plays-a.plays)[0]||{title:'—',plays:0,artist:''};
  ctx.fillStyle=p.acc;f(28,'700');t('MI RESUMEN',PAD,376);
  ctx.fillStyle=p.txt;f(114,'900');t('Stats que',PAD,500);ctx.fillStyle=p.acc;f(114,'900');t('importan',PAD,624);
  rrect(PAD,662,64,5,2.5,p.acc);
  rrect(PAD,716,W-PAD*2,248,24,'rgba(255,255,255,.04)',`rgba(${p.accRGB},.14)`);
  ctx.fillStyle=p.sub;f(30,'600');t('TIEMPO TOTAL',PAD+36,780);
  ctx.fillStyle=p.txt;f(110,'900');t(mins.toLocaleString()+' min',PAD+36,898);
  ctx.fillStyle=p.sub;f(34,'400');t(hrs+' horas',PAD+36,944);
  rrect(PAD,990,W-PAD*2,218,24,'rgba(255,255,255,.04)',`rgba(${p.accRGB},.14)`);
  ctx.fillStyle=p.sub;f(28,'600');t('ARTISTA #1',PAD+36,1052);
  const aN=topA.name.length>16?topA.name.slice(0,16)+'…':topA.name;
  ctx.fillStyle=p.txt;f(82,'900');t(aN,PAD+36,1158);
  ctx.fillStyle=p.acc;f(38,'700');rt(topA.plays.toLocaleString()+' plays',W-PAD-36,1158);
  rrect(PAD,1236,W-PAD*2,218,24,'rgba(255,255,255,.04)',`rgba(${p.accRGB},.14)`);
  ctx.fillStyle=p.sub;f(28,'600');t('CANCIÓN #1',PAD+36,1298);
  const sN=(topS.title||'').length>16?(topS.title||'').slice(0,16)+'…':(topS.title||'');
  ctx.fillStyle=p.txt;f(76,'900');t(sN,PAD+36,1398);
  ctx.fillStyle=p.sub;f(32,'400');t(topS.artist||'',PAD+36,1444);
  ctx.fillStyle=p.acc;f(38,'700');rt(topS.plays+'×',W-PAD-36,1398);
  rrect(PAD,1484,W-PAD*2,166,24,`rgba(${p.accRGB},.09)`);
  ctx.fillStyle=p.txt;f(76,'900');t('🔥 '+(s.streak||0)+' días de racha',PAD+36,1594);
}

async function render(){
  const p=PALS[palKey],handle=document.getElementById('handleInput').value.trim();
  ctx.clearRect(0,0,W,H);bg(p);header(p,handle,PERIODS[period]);
  if(cardType==='artistas')await drawArtistas(p,state);
  else if(cardType==='canciones')await drawCanciones(p,state);
  else if(cardType==='minutos')drawMinutos(p,state);
  else if(cardType==='resumen') await drawResumen(p,state); else drawMinutos(p,state);
  footer(p);
}

function setType(t,btn){cardType=t;document.querySelectorAll('.type-btn').forEach(e=>e.classList.remove('active'));btn.classList.add('active');render();}
function setPalette(k,el){palKey=k;document.querySelectorAll('.pal').forEach(e=>e.classList.remove('active'));el.classList.add('active');render();}
function setPeriod(p,btn){period=p;btn.closest('.period-row').querySelectorAll('.period-btn').forEach(e=>e.classList.remove('active'));btn.classList.add('active');render();}

function download(){const a=document.createElement('a');a.download=`musicstats-${cardType}-${Date.now()}.png`;a.href=C.toDataURL('image/png');a.click();toast('✓ Imagen descargada');}
async function copyImg(){try{C.toBlob(async b=>{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('✓ Copiada al portapapeles');});}catch{download();}}
function openIG(){download();setTimeout(()=>{if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))window.location.href='instagram://story-camera';else window.open('https://www.instagram.com/','_blank');toast('📱 Sube la imagen a tu historia');},700);}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}

// ── Artwork helper for canvas ──
async function loadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function drawArtworkInCanvas(ctx, url, x, y, w, h, r) {
  if (!url) return false;
  const img = await loadImage(url);
  if (!img) return false;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.clip();
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
  return true;
}

window.addEventListener('load',()=>{
  state=loadState()||demo();
  const h=state.userName&&state.userName!=='Demo'?state.userName:'';
  document.getElementById('handleInput').value=h;
  render();
});
